# Record of the settings used for every run. The code is the source of truth:
# src/train.py (shared budget, learning rates) and src/models.py (method configs).
# Each result JSON also stores its own hyperparams and method_config.

model: roberta-base

shared:                 # same for every method
  optimizer: adamw
  weight_decay: 0.01
  warmup_ratio: 0.06
  batch_size: 32
  max_length: 128
  fp16: true
  epochs: {sst2_full: 3, mrpc_full: 10, rte_full: 10, all_1k: 20}
  seeds: [1, 2, 3]      # SST-2 full: seed 1 only
  model_selection: best dev accuracy (10% of train), evaluated every epoch

methods:
  full_ft:
    learning_rate: 2.0e-5        # LR search: 1e-5, 2e-5, 3e-5
  lora:
    learning_rate: 5.0e-4        # LR search: 1e-4, 3e-4, 5e-4
    r: 8
    lora_alpha: 16
    lora_dropout: 0.1
    target_modules: [query, value]
  adapter:
    learning_rate: 3.0e-4        # LR search: 1e-4, 3e-4, 1e-3
    config: double_seq_bn        # Houlsby
    reduction_factor: 16
  prompt_tuning:
    learning_rate: 1.0e-2        # LR search: 1e-3, 1e-2, 3e-2
    num_virtual_tokens: 20
    prompt_tuning_init: RANDOM

ablations:              # RTE full data, seeds 1-3, one setting changed at a time
  full_ft: {frozen_layers: [3, 6, 9]}
  lora: {lora_rank: [1, 4, 16, 64]}          # lora_alpha = 2 * r
  adapter: {config: [seq_bn], reduction_factor: [8, 64]}
  prompt_tuning: {num_virtual_tokens: [5, 50, 100], init: [TEXT]}
